name: 构建与打包发布 (Windows .exe & macOS .dmg)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: false
        default: 'v1.3.1'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps -D electron@33.2.1 electron-builder@25.1.8

      - name: Build Web Dist
        run: npm run build

      - name: Package Windows (.exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish never

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            release/*.exe

  build-macos:
    name: Build macOS (Intel x64 & Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps -D electron@33.2.1 electron-builder@25.1.8

      - name: Build Web Dist
        run: npm run build

      - name: Package macOS Intel (x64) and Apple Silicon (arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --x64 --arm64 --publish never

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            release/*.dmg
            release/*.zip

  publish-release:
    name: Publish GitHub Release (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.3.1' }})
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist-release

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist-release

      - name: Display Release Files
        run: |
          ls -lh dist-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.3.1' }}
          name: WorkBuddy 自动化工具 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.3.1' }} 正式发布
          files: |
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/*.zip
          draft: false
          prerelease: false
          body: |
            ### 🌟 WorkBuddy 自动化工具 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.3.1' }} 正式发布

            本版本为 **WorkBuddy 自动化工具 v1.3.1**，重点完成云端沙箱 ACP 真实对话链路打通、版本升级弹窗交互精简，以及全链路细粒度任务日志：

            #### 🚀 核心升级内容 (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.3.1' }})
            1. **真实云端沙箱 ACP 对话与专家检索闭环**：
               - 接入官方市场专家/团队检索接口（`/portal/operation-platform/market/expert/list`、`/api/v2/open-platform/experts`）与 CDN 静态清单，精准匹配专家 `id`、`displayName` 与初始提示词；
               - 云端对话升级为真实 StreamableHTTP ACP 协议（`/acp/bootstrap` 建立 SSE 并获取 `Acp-Connection-Id`，再通过 `session/prompt` 发送真实对话消息），完整对齐 `/v2/report` 官方埋点字段。
            2. **版本升级弹窗自动检测与界面精简**：
               - 点击主页「版本升级」或版本号即可自动触发最新版本检测，无需进入弹窗后手动点击；
               - 当检测为最新版本时，隐藏多余环境选择/加速源/安装包下载区域，直接清晰展示「当前已是最新版本」；发现新版本时支持应用内流式下载与自动启动安装（免浏览器跳转）。
            3. **任务执行全链路细粒度日志**：
               - 实时打印每一步具体执行动作与接口返回（账号身份解析、专家检索命中源与 ID、建会话状态、ACP 沙箱连接与响应、usage/埋点上报状态、1.5s 结算核验与领奖结果），方便随时截图排查问题。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
