name: 构建与打包发布 (Windows .exe & macOS .dmg)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps -D electron@33.2.1 electron-builder@25.1.8

      - name: Build Web Dist
        run: npm run build

      - name: Package Windows (.exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish never

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            release/*.exe

  build-macos:
    name: Build macOS (Intel x64 & Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps -D electron@33.2.1 electron-builder@25.1.8

      - name: Build Web Dist
        run: npm run build

      - name: Package macOS Intel (x64) and Apple Silicon (arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --x64 --arm64 --publish never

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            release/*.dmg
            release/*.zip

  publish-release:
    name: Publish GitHub Release (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.0.0' }})
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist-release

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist-release

      - name: Display Release Files
        run: |
          ls -lh dist-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.0.0' }}
          name: WorkBuddy 自动化工具 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.0.0' }} 正式发布
          files: |
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/*.zip
          draft: false
          prerelease: false
          body: |
            ### 🌟 WorkBuddy 自动化工具 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.0.0' }} 正式发布

            本版本为 **WorkBuddy 自动化工具 v1.0.0** 首个正式发行版本，集成 License 软件授权校验、多账号全链路任务自动执行与自动领奖、多源在线流式升级及跨平台桌面端打包能力：

            #### 🚀 核心功能亮点 (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.0.0' }})
            1. **License 软件授权与弱网不断流机制**：
               - 安装与启动支持先跳过预览，核心自动化业务执行与账号管理受 License 授权校验保护，激活成功后实时展示可用剩余天数；
               - 支持在线授权码激活绑定与离线 `.lic` 证书验签，内置系统代理自适应、IPv4 优先与 35 秒长超时多通道探测，外网波动时自动启用本地宽限授权不中断使用。
            2. **成长中心任务全链路自动化与自动领奖**：
               - 支持每日签到活跃、猫猫旅行自动启程与归来领奖、官方专家召回对话、模板/自动化/技能/资料库等任务真实执行并自动同步官方实时积分；
               - 支持无状态单账号认证与严格的多账号权限隔离（仅执行已勾选账号，日志与积分按账号独立隔离，支持一键复制日志）。
            3. **应用内免浏览器流式更新**：
               - 点击版本升级自动识别当前系统环境（Windows x64 / macOS arm64 / macOS x64）并检测最新版本，内置多源加速节点流式下载与自动拉起安装。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
