name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Dist
        run: |
          npm run build

      - name: Package Windows Desktop App (.exe)
        run: |
          npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workbuddy-tools-windows
          path: release/*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.version || 'v1.0.0' }}
          name: WorkBuddy 账号日常工具 ${{ github.ref_name || inputs.version || 'v1.0.0' }}
          files: release/*.exe
          draft: false
          prerelease: false
          body: |
            ## 🚀 WorkBuddy 账号日常工具 v1.0.0

            ### 🌟 主要功能特性：
            - **官方接口直连**：对接 `workbuddy.cn` 官方成长中心 API，真实完成每日成长任务与打卡活跃；
            - **多账号集中管理**：支持批量配置多账号凭据 (Cookie / Token)，多账号一键自动化切换运行；
            - **猫猫旅行自动化**：支持自动检测猫猫状态、自动启程旅行并领取旅行结算积分奖励；
            - **一键执行日常与领奖**：自动化批量接取成长任务并直接将积分领取入账；
            - **双运行模式**：支持 Windows EXE 桌面客户端开箱即用，也支持本地浏览器访问模式。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
