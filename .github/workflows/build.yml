name: Build and Release Cross-Platform Packages (Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps -D electron electron-builder

      - name: Build Web Dist
        run: |
          npm run build

      - name: Generate Authenticode Code Signing Certificate & Package Windows (.exe)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=WorkBuddy Studio, O=WorkBuddy Studio, C=CN" -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          $pwd = ConvertTo-SecureString -String "workbuddy2026" -Force -AsPlainText
          $pfxPath = Join-Path $PWD "workbuddy-cert.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pwd
          $env:CSC_LINK = $pfxPath
          $env:CSC_KEY_PASSWORD = "workbuddy2026"
          npx electron-builder --win --x64 --publish never

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            release/*.exe
            release/*.zip

  build-macos:
    name: Build macOS (Intel x64 & Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps -D electron electron-builder

      - name: Build Web Dist
        run: |
          npm run build

      - name: Package macOS Intel (x64) and Apple Silicon (arm64)
        run: |
          npx electron-builder --mac --x64 --arm64 --publish never

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            release/*.dmg
            release/*.zip

  publish-release:
    name: Publish GitHub Release (v1.1.0)
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist-release

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist-release

      - name: Display Release Files
        run: |
          ls -lh dist-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version || 'v1.1.0' }}
          name: WorkBuddy 账号日常工具 ${{ github.ref_name || inputs.version || 'v1.1.0' }}
          files: |
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/*.zip
          draft: false
          prerelease: false
          body: |
            ### 🌟 WorkBuddy 账号日常工具 v1.1.0 正式发布

            本版本针对桌面客户端 UI 渲染、Windows 安装安全签名、专属桌面图标及全平台打包进行了全面升级：

            #### 🚀 核心新特性与优化
            1. **桌面端 UI 完美呈现 & 专属图标**：
               - 修复 Electron 本地打包资源路径 (`base: './'`)，启动直接呈现完整深色工作台界面；
               - 移除顶部多余原生菜单栏 (`File Edit View Window`)，配备全新定制的 **WorkBuddy 极客绿机械猫专属应用图标**（`.ico` / `.png`）；
            2. **Windows 安装包安全体验优化**：
               - 启用 SHA-256 Authenticode 数字签名证书与完整发行商元数据 (`WorkBuddy Studio`)；
               - 采用用户级免提权安装 (`requestedExecutionLevel: asInvoker`, `perMachine: false`)，告别安装时的管理员安全风险警告弹窗，并同步提供 `.zip` 免安装解压版；
            3. **官方接口精准对接与实时积分同步**：
               - 完美适配 APISIX 网关协议与 `TotalCredits` 实时积分查询，支持直接粘贴 cURL 命令自动提取 Cookie 凭据，支持双击账号随时编辑与安全删除。
            4. **全平台客户端支持 (3 大打包架构)**：
               - 🪟 **Windows x64**：`setup.exe`（安装包）、`portable.exe`（单文件便携版）、`win-x64.zip`（免安装绿色压缩包）；
               - 🍎 **macOS Intel (x64)**：`mac-x64.dmg` 安装镜像；
               - 🍏 **macOS Apple Silicon (M1/M2/M3/M4 arm64)**：`mac-arm64.dmg` 安装镜像。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
