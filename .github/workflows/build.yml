name: 构建与打包发布 (Windows .exe & macOS .dmg)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: false
        default: 'v1.3.2'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps -D electron@33.2.1 electron-builder@25.1.8

      - name: Build Web Dist
        run: npm run build

      - name: Package Windows (.exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish never

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            release/*.exe

  build-macos:
    name: Build macOS (Intel x64 & Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps -D electron@33.2.1 electron-builder@25.1.8

      - name: Build Web Dist
        run: npm run build

      - name: Package macOS Intel (x64) and Apple Silicon (arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --x64 --arm64 --publish never

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            release/*.dmg
            release/*.zip

  publish-release:
    name: Publish GitHub Release (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.3.2' }})
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist-release

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist-release

      - name: Display Release Files
        run: |
          ls -lh dist-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.3.2' }}
          name: WorkBuddy 自动化工具 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.3.2' }} 正式发布
          files: |
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/*.zip
          draft: false
          prerelease: false
          body: |
            ### 🌟 WorkBuddy 自动化工具 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.3.2' }} 正式发布

            本版本为 **WorkBuddy 自动化工具 v1.3.2**，重点修复 Cookie 鉴权 401 错配导致的专家/技能/资料库任务失败问题，强化多账号权限控制与完全隔离，并优化实时积分刷新与日志体验：

            #### 🚀 核心升级内容 (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.3.2' }})
            1. **彻底修复 Cookie 鉴权 401 错配与剩余任务全链路打通**：
               - 修复 Cookie 账号请求误带桌面端平台头导致的 401 Unauthorized 与全局共享 Cookie Jar 串号问题，改为无状态单账号独立认证；
               - 优化官方专家模糊检索（支持跳转链接 ID 提取、关键词归一化与 `internalExpert.json` 兜底），补齐「无畏契约拼豆专家」「商家宣传页与海报设计师」「腾讯轻量云」召回链路；
               - 补全「尝鲜热门技能」（SkillHub 查询 + `/v2/user-asset/skill/install` 安装 + 技能使用埋点）与「体验资料库」（NetDrive/TDrive + `asset_cloud_list_show` / `asset_cloud_sync` 埋点）真实协议。
            2. **严格权限控制与全链路账号隔离**：
               - 默认执行范围严格锁定「仅已选账号」，勾选操作自动启用权限隔离，未勾选账号绝对不会被连带执行；
               - 账号之间的任务状态、运行日志、实时积分与认证缓存完全隔离，互不串号。
            3. **日志可观测性增强与一键复制**：
               - 每条日志均在前缀清晰标明 `[操作账号: 昵称 (短ID)]`，支持切换「仅当前账号 / 全部日志」视图，并在日志栏新增「复制日志」一键复制按钮；
               - 修复任务领奖后顶部实时积分未刷新与浮点精度尾巴（如 `.40000002`）展示问题。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
