name: 构建与打包发布 (Windows .exe & macOS .dmg)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: false
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps -D electron@33.2.1 electron-builder@25.1.8

      - name: Build Web Dist
        run: npm run build

      - name: Package Windows (.exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish never

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            release/*.exe

  build-macos:
    name: Build macOS (Intel x64 & Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps -D electron@33.2.1 electron-builder@25.1.8

      - name: Build Web Dist
        run: npm run build

      - name: Package macOS Intel (x64) and Apple Silicon (arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --x64 --arm64 --publish never

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            release/*.dmg
            release/*.zip

  publish-release:
    name: Publish GitHub Release (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.0.2' }})
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist-release

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist-release

      - name: Display Release Files
        run: |
          ls -lh dist-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.0.2' }}
          name: WorkBuddy 自动化工具 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.0.2' }} 正式发布
          files: |
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/*.zip
          draft: false
          prerelease: false
          body: |
            ### 🌟 WorkBuddy 自动化工具 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.0.2' }} 正式发布

            #### ✨ v1.0.2 更新内容
            1. **修复并重构自动猫猫旅行与后台定时引擎**：
               - 修复桌面端最小化到右下角托盘后因浏览器后台节流导致定时任务不触发的问题：启用 Electron `backgroundThrottling: false` 并接入主进程无节流心跳时钟与系统休眠唤醒监听 (`powerMonitor`)；
               - 修复官方猫猫旅行状态字段不匹配导致跳过出发的问题，全面兼容多形态状态返回，支持旅行中自动挂起并在归来后自动领奖。
            2. **新增可配置每日定时触发时间（精确到秒）**：
               - 支持在主界面直接配置每日自动触发时间（默认 `08:00:00`，支持自定义任意 `HH:mm:ss`）；
               - 到达设定时间后严格按链路自动执行 **「签到 → 猫猫旅行 → 领奖」** 并同步刷新实时积分，同时新增「立即测试」按钮便于随时验证。
            3. **控制台日志全链路同步输出**：
               - 定时触发、签到状态、猫猫状态解析、出发/归来领奖、成长中心待领奖任务领取与最新实时积分均同步输出至底部日志控制台。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
