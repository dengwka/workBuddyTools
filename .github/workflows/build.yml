name: 构建与打包发布 (Windows .exe & macOS .dmg)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: false
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps -D electron@33.2.1 electron-builder@25.1.8

      - name: Build Web Dist
        run: npm run build

      - name: Package Windows (.exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish never

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            release/*.exe

  build-macos:
    name: Build macOS (Intel x64 & Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps -D electron@33.2.1 electron-builder@25.1.8

      - name: Build Web Dist
        run: npm run build

      - name: Package macOS Intel (x64) and Apple Silicon (arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --x64 --arm64 --publish never

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            release/*.dmg
            release/*.zip

  publish-release:
    name: Publish GitHub Release (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.3.0' }})
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist-release

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist-release

      - name: Display Release Files
        run: |
          ls -lh dist-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.3.0' }}
          name: WorkBuddy 自动化工具 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.3.0' }} 正式发布
          files: |
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/*.zip
          draft: false
          prerelease: false
          body: |
            ### 🌟 WorkBuddy 自动化工具 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.3.0' }} 正式发布

            本版本正式更名为 **WorkBuddy 自动化工具**，全面升级成长中心自动领奖、专家与对话任务真实执行链路，并重磅推出应用内流式下载与自动安装升级器：

            #### 🚀 核心升级内容 (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v1.3.0' }})
            1. **品牌升级为「WorkBuddy 自动化工具」**：
               - 统一客户端窗口标题、桌面快捷方式、Electron 安装包及 GitHub Releases 发布标题格式为 `WorkBuddy 自动化工具 vxxx 正式发布`。
            2. **已完成任务自动识别与自动领奖闭环**：
               - 自动识别官方成长中心进度已满的 `待领奖` 任务，一键全自动运行优先触发领奖并支持列表内「立即领奖」；
               - 补全成长中心 Web 请求标头与 Cookie 身份提取，兼容多种官方 `/claim`、`/receive` 领奖接口及埋点上报，失败时输出清晰诊断日志。
            3. **召回专家 / 专家团 / 对话 / 技能任务真实链路修复**：
               - 接入官方专家搜索、专家团队与排行榜真实接口，移除占位 ID，使用真实官方专家/团队 ID 发起召回；
               - 云端对话升级为「创建会话 + 发送真实消息对话 + 进度核验后延迟清理」，彻底解决原建完即删导致 `0/1`、`0/3`、`0/5` 无法完成的问题；
               - 拆分并完善「尝鲜热门技能」「体验『资料库』」「和 AI 聊天 5 次」「领取一只 Buddy」等任务执行机制与助手引导。
            4. **应用内流式下载与自动安装升级器（彻底解决 404 浏览器跳转）**：
               - 实时拉取 GitHub Releases 真实平台资产列表，点击更新后直接在应用内通过多节点镜像（`GHFast` / `GH-Proxy` / GitHub 直连）流式下载，全程不再跳转打开外部浏览器；
               - 更新按钮下方实时显示下载百分比、体积、速率、剩余时间与阶段状态，完整性校验通过后自动拉起 `.exe` / `.dmg` 系统安装程序。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
