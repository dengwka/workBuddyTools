name: 构建与打包发布 (Windows .exe & macOS .dmg)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: false
        default: 'v1.2.1'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps -D electron@33.2.1 electron-builder@25.1.8

      - name: Build Web Dist
        run: npm run build

      - name: Package Windows (.exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish never

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            release/*.exe

  build-macos:
    name: Build macOS (Intel x64 & Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps -D electron@33.2.1 electron-builder@25.1.8

      - name: Build Web Dist
        run: npm run build

      - name: Package macOS Intel (x64) and Apple Silicon (arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --x64 --arm64 --publish never

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            release/*.dmg
            release/*.zip

  publish-release:
    name: Publish GitHub Release (v1.2.1)
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist-release

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist-release

      - name: Display Release Files
        run: |
          ls -lh dist-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version || 'v1.2.1' }}
          name: WorkBuddy 账号日常工具 ${{ github.ref_name || inputs.version || 'v1.2.1' }} 正式发布
          files: |
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/*.zip
          draft: false
          prerelease: false
          body: |
            ### 🌟 WorkBuddy 账号日常工具 v1.2.1 正式发布

            本版本全面对接 WorkBuddy 官方生产环境真实业务 API 与 `/v2/report` 埋点协议，内置「腾讯 WorkBuddy」官方公众号高清扫码关注卡片，修复官网跳转路由与 `NaN/1` 进度显示，并支持日志控制台默认收起与鼠标自由拖拽调节高度：

            #### 🚀 核心升级内容 (v1.2.1)
            1. **真实业务 API + `/v2/report` 埋点一键完成（告别虚辅助完成）**：
               - 对接官方 `/v2/report` (`CloudProductMetricsReporter`)、`/console/as/conversations/`、`/api/v2/open-platform/asset-shares/c2c/channels`、`/v2/as/scheduler/tasks`、`/billing/meter/daily-checkin`、`/v2/activity/growth/subscribe-task/status` 等真实接口；
               - 任务列表右侧操作升级为 **「一键完成」**，自动执行云端对话/分享/模板/定时任务创建并自动清理临时会话。
            2. **「关注腾讯 WorkBuddy 官方公众号」内置官方二维码直接扫**：
               - 任务右侧提供 **「扫码关注」** 按钮，点开直接展示「腾讯 WorkBuddy」官方公众号二维码，手机微信扫一扫即可关注；
               - 点击「同步关注状态并立即领奖」自动调用 `/v2/activity/growth/subscribe-task/status` 同步关注状态并领奖。
            3. **修复官网跳转 404 与 `NaN/1` 进度显示**：
               - 修复原 `/experts` 404 路由，更新为官方真实工作台 `https://www.workbuddy.cn/app` 与成长中心 `https://www.workbuddy.cn/profile/growth-center`；
               - 清洗任务进度数值，彻底消除 `NaN/1` 显示。
            4. **UI 细节与 `kuaixuntong` 同款安装包方案**：
               - 底部操作栏防换行（点击运行时文字绝不折行）；
               - 底部日志控制台默认关闭收起，支持按住顶部边缘鼠标上下拖动自由调节高度；
               - 采用 `kuaixuntong` 同款 `workbuddyTools-Setup-1.2.1.exe` 标准 NSIS 安装向导与多源流式直装升级器。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
