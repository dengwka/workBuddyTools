name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps -D electron electron-builder

      - name: Build Web Dist
        run: |
          npm run build

      - name: Package Windows Desktop App (.exe)
        run: |
          npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workbuddy-tools-windows
          path: release/*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.version || 'v1.0.0' }}
          name: WorkBuddy 账号日常工具 ${{ github.ref_name || inputs.version || 'v1.0.0' }}
          files: release/*.exe
          draft: false
          prerelease: false
          body: |
            ### 🌟 WorkBuddy 账号日常工具 v1.0.0

            - **官方接口真实对接**：直连 workbuddy.cn 成长中心 API，真实完成每日成长任务与签到打卡并入账积分；
            - **多账号集中管理**：支持配置多个账号 Cookie / Token，一键批量检测与执行；
            - **猫猫旅行自动化**：支持自动检测猫猫状态、自动启程旅行并结算领取旅行积分奖励；
            - **双端支持**：支持本地浏览器访问，也可下载打包后的 Windows EXE 桌面客户端直接使用。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
