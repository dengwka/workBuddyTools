name: 构建与打包发布 (Windows .exe & macOS .dmg)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps -D electron@33.2.1 electron-builder@25.1.8

      - name: Build Web Dist
        run: npm run build

      - name: Package Windows (.exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish never

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            release/*.exe

  build-macos:
    name: Build macOS (Intel x64 & Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps -D electron@33.2.1 electron-builder@25.1.8

      - name: Build Web Dist
        run: npm run build

      - name: Package macOS Intel (x64) and Apple Silicon (arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --x64 --arm64 --publish never

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            release/*.dmg
            release/*.zip

  publish-release:
    name: Publish GitHub Release (v1.2.0)
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist-release

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist-release

      - name: Display Release Files
        run: |
          ls -lh dist-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version || 'v1.2.0' }}
          name: WorkBuddy 账号日常工具 ${{ github.ref_name || inputs.version || 'v1.2.0' }} 正式发布
          files: |
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/*.zip
          draft: false
          prerelease: false
          body: |
            ### 🌟 WorkBuddy 账号日常工具 v1.2.0 正式发布

            本版本同步采用 `kuaixuntong` 同款无自签名污染 NSIS 打包方案与多节点流式更新器，并新增 13 项成长中心任务执行助手、单任务完成后实时调官方接口刷新积分及纯净无外层滚动的桌面端 UI 布局：

            #### 🚀 核心升级内容
            1. **采用 `kuaixuntong` 同款打包与流式直装方案（解决 Windows 伪自签名根证书拦截）**：
               - 移除会导致 Windows 报 `TRUST_E_UNTRUSTEDROOT` 伪造根证书拦截的自签名逻辑，采用与 `kuaixuntong` 完全一致的 `electron@33.2.1` + `electron-builder@25.1.8` 标准 NSIS 安装向导（`workbuddyTools-Setup-1.2.0.exe`）；
               - 内置 `kuaixuntong` 同款多源 CDN 加速流式下载器（`GHFast` / `GH-Proxy` / `GitHub直连`），直接通过 Node.js `fs.createWriteStream` 写入临时目录并调用 `shell.openPath` 启动安装，不产生浏览器 `Zone.Identifier` 联网标记。
            2. **13 项未完成任务专属自动触发 + 快捷完成助手**：
               - 覆盖专家对话类（无畏契约拼豆专家、中国电商运营专家、抖音策略师、商家宣传页与海报设计师、直播电商教练、召唤 5 次专家联动）、专家团（3次）、模板（5个）、自动化任务、探索优秀灵感 (PC)、体验「发现应用」、分享技能给好友、关注官方公众号 (满24h)；
               - 支持自动携带 `WorkBuddy/5.9.0` 桌面端标识上报任务进度与领奖，并在每一行任务右侧提供 **「辅助完成」** 按钮。
            3. **每完成一个任务实时调用官方接口刷新积分**：
               - 每完成/领取一项任务后立即调用 `/billing/meter/get-user-resource-summary` 接口从服务端拉取最新 `TotalCredits`。
            4. **桌面端纯净固定视口 UI（消除鼠标上下整页滚动）**：
               - 打包后仅保留核心工作台区域，采用 `100vh` 固定视口与内部独立滚动区。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
